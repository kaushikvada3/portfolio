# Deploys the portfolio (index.html + js/ + logos) to GitHub Pages.
name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches:
      - main
      - eda-tool-theme
    paths:
      - 'index.html'
      - 'js/**'
      - 'assets/logos/**'
      - 'resume.pdf'
      - 'og-image.png'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        run: |
          mkdir -p _site/js _site/assets/logos
          cp index.html resume.pdf og-image.png _site/
          cp js/*.js _site/js/
          cp assets/logos/tenstorrent.svg assets/logos/arm.svg assets/logos/ucr.svg _site/assets/logos/
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
