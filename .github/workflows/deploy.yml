# Deploys the portfolio to GitHub Pages: the locked index.html and the résumé.
# index.html is built locally by dev/lock-site.py with the chip scripts and
# logos encrypted inside it, so neither is copied here.
name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches:
      - main
      - eda-tool-theme
    paths:
      - 'index.html'
      - 'resume.pdf'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        run: |
          # never publish an unlocked page
          grep -q '<script type="application/json" id="vault">' index.html
          mkdir -p _site
          cp index.html resume.pdf _site/
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
